[mod-setting-description]
ezactions-hold-release=With FSE (single player): hold the radial key, point at a slice, let go of the key to run it (a bundle opens and then waits for a click). Off, after a quick tap, or without FSE: click a slice, or press the key again over it. Right-click goes back.
ezactions-show-hover-label=The pointed slice's title and note in the middle of the ring.
ezactions-command-lines=Height of the command box in the editor.
ezactions-open-style=wipe: slices appear one after another around the ring. fade: the ring fades in. grow: the ring expands from the middle.
ezactions-design=solid, segmented, outline, glass: a ring drawn like EZ Actions' (single player, with a character). slot, button, tool: Factorio buttons in a circle (also used in multiplayer and without a character).
ezactions-slice-gap=Space between slices (segmented style, and the lit slice).
ezactions-ring-color=The ring's colour; its alpha is the see-through.
ezactions-hover-color=The slice under the mouse.
ezactions-icon-outline=Behind each icon on the drawn ring: a black stroke around its shape (helps light icons), a soft white glow (helps dark icons), or both. Each slice can choose its own in the editor.
ezactions-direction=Which way the wipe goes round.
ezactions-hover-style=How the pointed slice shows: lit and bigger, lit, bigger, or not at all.
ezactions-hover-grow=How much bigger the pointed slice gets (0.15 = 15 %).
ezactions-deadzone=How far the mouse must move from the middle before a slice is pointed at.
ezactions-scale-start=The ring keeps its radius up to this many slices, then grows.
ezactions-animations=All of the radial's animations; off, it shows at once and the pointed slice only lights up.
ezactions-anim-open=The ring's open animation (see Open style).
ezactions-anim-hover=The pointed slice's animation (see Hover style).
ezactions-open-ms=How long the open animation takes.
ezactions-radius=The ring's outer radius in pixels (at UI scale 100 %).
ezactions-button-size=The slices' icons, in pixels.
ezactions-scale-per-item=Past "Grow the ring after this many slices", each extra slice adds this many pixels to the radius.
ezactions-border-color=The thin line around the drawn ring.
ezactions-text-color=The hover label's text.

